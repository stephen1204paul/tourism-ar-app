version: '3.8'

services:
  # PostgreSQL with PostGIS for geospatial data
  postgres:
    image: postgis/postgis:15-3.3
    container_name: tourism-ar-postgres
    environment:
      POSTGRES_DB: tourism_ar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/shared/database/init:/docker-entrypoint-initdb.d
    networks:
      - tourism-ar-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: tourism-ar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tourism-ar-network

  # MongoDB for flexible content storage
  mongodb:
    image: mongo:6
    container_name: tourism-ar-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password
      MONGO_INITDB_DATABASE: tourism_ar_content
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - tourism-ar-network

  # Elasticsearch for search functionality
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: tourism-ar-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - tourism-ar-network

  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio
    container_name: tourism-ar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tourism-ar-network

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile.dev
    container_name: tourism-ar-api-gateway
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/tourism_ar_db
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://admin:mongodb_password@mongodb:27017/tourism_ar_content?authSource=admin
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    depends_on:
      - postgres
      - redis
      - mongodb
      - elasticsearch
      - minio
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    networks:
      - tourism-ar-network

  # Auth Service
  auth-service:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile.dev
    container_name: tourism-ar-auth-service
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/tourism_ar_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-here
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/services/auth:/app
      - /app/node_modules
    networks:
      - tourism-ar-network

  # Content Service
  content-service:
    build:
      context: ./backend/services/content
      dockerfile: Dockerfile.dev
    container_name: tourism-ar-content-service
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: development
      PORT: 4002
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/tourism_ar_db
      MONGODB_URL: mongodb://admin:mongodb_password@mongodb:27017/tourism_ar_content?authSource=admin
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    depends_on:
      - postgres
      - mongodb
      - minio
    volumes:
      - ./backend/services/content:/app
      - /app/node_modules
    networks:
      - tourism-ar-network

  # Location Service
  location-service:
    build:
      context: ./backend/services/location
      dockerfile: Dockerfile.dev
    container_name: tourism-ar-location-service
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: development
      PORT: 4003
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/tourism_ar_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/services/location:/app
      - /app/node_modules
    networks:
      - tourism-ar-network

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tourism-ar-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:4000/graphql
      REACT_APP_MINIO_URL: http://localhost:9000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tourism-ar-network

  # Nginx reverse proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: tourism-ar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - api-gateway
    networks:
      - tourism-ar-network

networks:
  tourism-ar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  elasticsearch_data:
  minio_data: